no aaa root
aaa authentication policy local allow-nopassword-remote-login
!
username admin privilege 15 role network-admin nopassword
!
load-interval default 1
!
transceiver qsfp default-mode 4x10G
!
interface defaults
   mtu 9214
!
service routing protocols model multi-agent
!
hostname BB2
ip name-server vrf MGMT 8.8.8.8
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
aaa authorization exec default local
!
interface Ethernet1
   description P2P_A-LEAF7_Ethernet8
   no shutdown
   mtu 9214
   no switchport
   ip address 172.16.1.4/31
!
interface Ethernet2
   description P2P_A-LEAF8_Ethernet8
   no shutdown
   mtu 9214
   no switchport
   ip address 172.16.1.6/31
!
interface Ethernet3
   description P2P_B-LEAF7_Ethernet8
   no shutdown
   mtu 9214
   no switchport
   ip address 172.16.2.4/31
!
interface Ethernet4
   description P2P_B-LEAF8_Ethernet8
   no shutdown
   mtu 9214
   no switchport
   ip address 172.16.2.6/31
!
interface Ethernet5
   description P2P_BB1_Ethernet5
   no shutdown
   mtu 9214
   no switchport
   ip address 172.16.255.1/31
!
interface Loopback0
   description Globally Unique Address
   no shutdown
   ip address 10.0.0.2/32
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.100.100.102/22
!
ip routing
no ip routing vrf MGMT
!
ip route vrf MGMT 0.0.0.0/0 172.100.100.1
!
peer-filter DC-ASN-RANGE
   10 match as-range 65100-65499 result accept
!
router bgp 65000
   router-id 1.1.0.2
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   graceful-restart restart-time 300
   graceful-restart
   bgp cluster-id 1.1.0.0
   maximum-paths 4
   bgp listen range 1.1.0.0/16 peer-group EVPN-GW-PEERS remote-as 65000
   bgp listen range 10.0.0.0/8 peer-group EVPN-GW-PEERS remote-as 65000
   bgp listen range 172.16.0.0/16 peer-group IP-TRANSPORT-CLIENTS peer-filter DC-ASN-RANGE
   neighbor default send-community
   neighbor EVPN-GW-PEERS peer group
   neighbor EVPN-GW-PEERS next-hop-unchanged
   neighbor EVPN-GW-PEERS update-source Loopback0
   neighbor EVPN-GW-PEERS bfd
   neighbor EVPN-GW-PEERS route-reflector-client
   neighbor IP-TRANSPORT-CLIENTS peer group
   neighbor IP-TRANSPORT-CLIENTS route-reflector-client
   !
   address-family evpn
      neighbor EVPN-GW-PEERS activate
   !
   address-family ipv4
      neighbor IP-TRANSPORT-CLIENTS activate
      network 10.0.0.2/32
!
router multicast
!
management ssh
   !
   vrf MGMT
      no shutdown
!
no service interface inactive port-id allocation disabled

!
end
