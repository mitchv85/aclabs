no aaa root
aaa authentication policy local allow-nopassword-remote-login
!
username admin privilege 15 role network-admin nopassword
!
dhcp relay
   tunnel requests disabled
!
switchport default mode routed
!
vlan internal order ascending range 1006 1199
!
event-monitor
!
load-interval default 1
!
service routing protocols model multi-agent
!
hostname B-LEAF1
ip domain lookup vrf MGMT source-interface Management0
ip name-server vrf MGMT 8.8.8.8
dns domain aclabs.lab
!
spanning-tree mode mstp
spanning-tree edge-port bpduguard default
spanning-tree root super
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
clock timezone America/Detroit
!
vlan 20
   name Green
!
vlan 40
   name Purple
!
vrf instance MGMT
!
vrf instance PROD
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
aaa authorization exec default local
!
interface Port-Channel7
   description SERVER_HostB1
   no shutdown
   bgp session tracker TRACK-LOCAL-EVPN-PEERS
   switchport access vlan 20
   switchport
   !
   evpn ethernet-segment
      identifier auto lacp
   lacp system-id c0d6.8200.0000
   spanning-tree portfast edge
!
interface Port-Channel8
   description SERVER_HostB2
   no shutdown
   bgp session tracker TRACK-LOCAL-EVPN-PEERS
   switchport access vlan 40
   switchport
   !
   evpn ethernet-segment
      identifier auto lacp
   lacp system-id c0d6.8200.0000
   spanning-tree portfast edge
!
interface Ethernet1
   description P2P_B-SPINE1_Ethernet1
   no shutdown
   mtu 9114
   no switchport
   ip address unnumbered Loopback0
   pim ipv4 sparse-mode
   isis enable 100
   isis circuit-type level-2
   isis network point-to-point
!
interface Ethernet2
   description P2P_B-SPINE2_Ethernet1
   no shutdown
   mtu 9114
   no switchport
   ip address unnumbered Loopback0
   pim ipv4 sparse-mode
   isis enable 100
   isis circuit-type level-2
   isis network point-to-point
!
interface Ethernet3
   description P2P_B-SPINE3_Ethernet1
   no shutdown
   mtu 9114
   no switchport
   ip address unnumbered Loopback0
   pim ipv4 sparse-mode
   isis enable 100
   isis circuit-type level-2
   isis network point-to-point
!
interface Ethernet4
   description P2P_B-SPINE4_Ethernet1
   no shutdown
   mtu 9114
   no switchport
   ip address unnumbered Loopback0
   pim ipv4 sparse-mode
   isis enable 100
   isis circuit-type level-2
   isis network point-to-point
!
interface Ethernet7
   description SERVER_HostB1_eth1
   no shutdown
   no switchport
   channel-group 7 mode active
!
interface Ethernet8
   description SERVER_HostB2_eth1
   no shutdown
   no switchport
   channel-group 8 mode active
!
interface Loopback0
   description Globally Unique Address
   no shutdown
   ip address 10.0.2.1/32
   isis enable 100
   isis passive
   isis circuit-type level-2
!
interface Loopback1
   description VTEP IP
   no shutdown
   ip address 10.1.2.1/32
   isis enable 100
   isis passive
   isis circuit-type level-2
!
interface Loopback101
   description OISM PIM/IGMP Source
   no shutdown
   vrf PROD
   ip address 10.101.101.1/32
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.100.102.105/22
!
interface Vlan20
   description Green
   no shutdown
   mtu 9014
   vrf PROD
   ip igmp
   pim ipv4 local-interface Loopback101
   ip address virtual 10.20.20.1/24
   ipv6 address virtual 2001:db8:20:20::1/64
   mld
!
interface Vlan40
   description Purple
   no shutdown
   mtu 9014
   vrf PROD
   ip igmp
   pim ipv4 local-interface Loopback101
   ip address virtual 10.40.40.1/24
   ipv6 address virtual 2001:db8:40:40::1/64
   mld
!
interface Vxlan1
   description B-LEAF1_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vrf PROD vni 50001
   vxlan vrf PROD multicast group 232.1.1.1
   vxlan vlan 20,40 vni 10020,10040
   vxlan vrf PROD multicast group overlay 239.0.20.101 encap 232.1.1.20 immediate
   vxlan multicast ipv6

!
mac address-table aging-time 1800
!
ip virtual-router mac-address 00:1c:73:00:00:01
!
ip routing
no ip routing vrf MGMT
ip routing vrf PROD
ipv6 unicast-routing vrf PROD
!
ip route vrf MGMT 0.0.0.0/0 172.100.100.1
!
arp aging timeout default 1500
!
ip http client local-interface Management0 vrf MGMT
ip ssh client source-interface Management0 vrf MGMT
!
ntp local-interface vrf MGMT Management0
ntp server vrf MGMT time.apple.com iburst
ntp server vrf MGMT time.google.com prefer iburst
ntp server vrf MGMT time.windows.com iburst
!
router bfd
   multihop interval 1000 min-rx 1000 multiplier 3
!
router bgp 65200
   router-id 10.0.2.1
   update wait-install
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 4
   neighbor default send-community
   neighbor LOCAL-EVPN-PEERS peer group
   neighbor LOCAL-EVPN-PEERS remote-as 65200
   neighbor LOCAL-EVPN-PEERS update-source Loopback0
   neighbor LOCAL-EVPN-PEERS bfd
   neighbor LOCAL-EVPN-PEERS session tracker TRACK-LOCAL-EVPN-PEERS
   neighbor 10.0.2.201 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.2.201 description B-SPINE1.EVPN
   neighbor 10.0.2.202 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.2.202 description B-SPINE2.EVPN
   neighbor 10.0.2.203 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.2.203 description B-SPINE3.EVPN
   neighbor 10.0.2.204 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.2.204 description B-SPINE4.EVPN
   !
   vlan 20
      rd 10.0.2.1:10020
      route-target both 10020:10020
      redistribute learned
      redistribute router-mac next-hop vtep primary
      redistribute router-mac virtual-ip next-hop vtep primary
   !
   vlan 40
      rd 10.0.2.1:10040
      route-target both 10040:10040
      redistribute learned
      redistribute router-mac next-hop vtep primary
      redistribute router-mac virtual-ip next-hop vtep primary
   !
   address-family evpn
      neighbor LOCAL-EVPN-PEERS activate
      route import match-failure action discard
      layer-2 fec in-place update
   !
   vrf PROD
      rd 10.0.2.1:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      update wait-install
      redistribute connected
      !
      evpn multicast
         address-family ipv4
         !
         address-family ipv6

   session tracker TRACK-LOCAL-EVPN-PEERS
      recovery delay 10 seconds
   !
   !
   address-family evpn
      route type ethernet-segment route-target auto

!
router isis 100
   net 49.1111.0000.0000.0001.00
   router-id ipv4 10.0.2.1
   is-type level-2
   log-adjacency-changes
   !
   address-family ipv4 unicast
   !
!
no service interface inactive port-id allocation disabled
mld snooping
   vlan 20,40
router multicast
   ipv4
      routing
   !
   vrf PROD
      ipv4
         routing
      !
      ipv6
         routing

!
end
