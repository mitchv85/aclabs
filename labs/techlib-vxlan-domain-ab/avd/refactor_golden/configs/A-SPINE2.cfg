no aaa root
aaa authentication policy local allow-nopassword-remote-login
!
username admin privilege 15 role network-admin nopassword
!
switchport default mode routed
!
event-monitor
!
load-interval default 1
!
service routing protocols model multi-agent
!
hostname A-SPINE2
ip domain lookup vrf MGMT source-interface Management0
ip name-server vrf MGMT 8.8.8.8
dns domain aclabs.lab
!
spanning-tree mode none
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
clock timezone America/Detroit
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
aaa authorization exec default local
!
interface Ethernet1
   description P2P_A-LEAF1_Ethernet2
   no shutdown
   mtu 9114
   no switchport
   ip address 192.168.0.16/31
   pim ipv4 sparse-mode
!
interface Ethernet2
   description P2P_A-LEAF2_Ethernet2
   no shutdown
   mtu 9114
   no switchport
   ip address 192.168.0.18/31
   pim ipv4 sparse-mode
!
interface Ethernet3
   description P2P_A-LEAF3_Ethernet2
   no shutdown
   mtu 9114
   no switchport
   ip address 192.168.0.20/31
   pim ipv4 sparse-mode
!
interface Ethernet4
   description P2P_A-LEAF4_Ethernet2
   no shutdown
   mtu 9114
   no switchport
   ip address 192.168.0.22/31
   pim ipv4 sparse-mode
!
interface Ethernet5
   description P2P_A-LEAF5_Ethernet2
   no shutdown
   mtu 9114
   no switchport
   ip address 192.168.0.24/31
   pim ipv4 sparse-mode
!
interface Ethernet6
   description P2P_A-LEAF6_Ethernet2
   no shutdown
   mtu 9114
   no switchport
   ip address 192.168.0.26/31
   pim ipv4 sparse-mode
!
interface Ethernet7
   description P2P_A-LEAF7_Ethernet2
   no shutdown
   mtu 9114
   no switchport
   ip address 192.168.0.28/31
   pim ipv4 sparse-mode
!
interface Ethernet8
   description P2P_A-LEAF8_Ethernet2
   no shutdown
   mtu 9114
   no switchport
   ip address 192.168.0.30/31
   pim ipv4 sparse-mode
!
interface Loopback0
   description Globally Unique Address
   no shutdown
   ip address 10.0.1.202/32
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.100.101.102/22
!
mac address-table aging-time 1800
!
ip routing
no ip routing vrf MGMT
!
ip prefix-list PL-LOOPBACKS
   seq 10 permit 10.0.0.0/16 eq 32
   seq 20 permit 10.1.0.0/16 eq 32
!
ip prefix-list PL-P2P-UNDERLAY
   seq 10 permit 192.168.0.0/24 le 31
!
ip route vrf MGMT 0.0.0.0/0 172.100.100.1
!
arp aging timeout default 1500
!
ip http client local-interface Management0 vrf MGMT
ip ssh client source-interface Management0 vrf MGMT
!
ntp local-interface vrf MGMT Management0
ntp server vrf MGMT time.apple.com iburst
ntp server vrf MGMT time.google.com prefer iburst
ntp server vrf MGMT time.windows.com iburst
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS
!
route-map RM-CONN-2-BGP permit 20
   match ip address prefix-list PL-P2P-UNDERLAY
!
router bgp 65100
   router-id 10.0.1.202
   update wait-install
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 4
   neighbor default send-community
   neighbor LOCAL-EVPN-PEERS peer group
   neighbor LOCAL-EVPN-PEERS next-hop-unchanged
   neighbor LOCAL-EVPN-PEERS update-source Loopback0
   neighbor LOCAL-EVPN-PEERS bfd
   neighbor LOCAL-EVPN-PEERS ebgp-multihop 3
   neighbor LOCAL-IPV4-PEERS peer group
   neighbor 10.0.1.1 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.1.1 remote-as 65101
   neighbor 10.0.1.1 description A-LEAF1.EVPN
   neighbor 10.0.1.2 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.1.2 remote-as 65101
   neighbor 10.0.1.2 description A-LEAF2.EVPN
   neighbor 10.0.1.3 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.1.3 remote-as 65103
   neighbor 10.0.1.3 description A-LEAF3.EVPN
   neighbor 10.0.1.4 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.1.4 remote-as 65103
   neighbor 10.0.1.4 description A-LEAF4.EVPN
   neighbor 10.0.1.5 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.1.5 remote-as 65105
   neighbor 10.0.1.5 description A-LEAF5.EVPN
   neighbor 10.0.1.6 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.1.6 remote-as 65105
   neighbor 10.0.1.6 description A-LEAF6.EVPN
   neighbor 10.0.1.7 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.1.7 remote-as 65107
   neighbor 10.0.1.7 description A-LEAF7.EVPN
   neighbor 10.0.1.8 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.1.8 remote-as 65108
   neighbor 10.0.1.8 description A-LEAF8.EVPN
   neighbor 192.168.0.17 peer group LOCAL-IPV4-PEERS
   neighbor 192.168.0.17 remote-as 65101
   neighbor 192.168.0.17 description A-LEAF1_Ethernet2
   neighbor 192.168.0.19 peer group LOCAL-IPV4-PEERS
   neighbor 192.168.0.19 remote-as 65101
   neighbor 192.168.0.19 description A-LEAF2_Ethernet2
   neighbor 192.168.0.21 peer group LOCAL-IPV4-PEERS
   neighbor 192.168.0.21 remote-as 65103
   neighbor 192.168.0.21 description A-LEAF3_Ethernet2
   neighbor 192.168.0.23 peer group LOCAL-IPV4-PEERS
   neighbor 192.168.0.23 remote-as 65103
   neighbor 192.168.0.23 description A-LEAF4_Ethernet2
   neighbor 192.168.0.25 peer group LOCAL-IPV4-PEERS
   neighbor 192.168.0.25 remote-as 65105
   neighbor 192.168.0.25 description A-LEAF5_Ethernet2
   neighbor 192.168.0.27 peer group LOCAL-IPV4-PEERS
   neighbor 192.168.0.27 remote-as 65105
   neighbor 192.168.0.27 description A-LEAF6_Ethernet2
   neighbor 192.168.0.29 peer group LOCAL-IPV4-PEERS
   neighbor 192.168.0.29 remote-as 65107
   neighbor 192.168.0.29 description A-LEAF7_Ethernet2
   neighbor 192.168.0.31 peer group LOCAL-IPV4-PEERS
   neighbor 192.168.0.31 remote-as 65108
   neighbor 192.168.0.31 description A-LEAF8_Ethernet2
   redistribute connected route-map RM-CONN-2-BGP
   !
   address-family evpn
      neighbor LOCAL-EVPN-PEERS activate
   !
   address-family ipv4
      neighbor LOCAL-IPV4-PEERS activate
!
router multicast
   ipv4
      routing
!
no service interface inactive port-id allocation disabled

!
end
