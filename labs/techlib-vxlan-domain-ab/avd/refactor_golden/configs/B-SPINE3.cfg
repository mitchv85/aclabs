no aaa root
aaa authentication policy local allow-nopassword-remote-login
!
username admin privilege 15 role network-admin nopassword
!
switchport default mode routed
!
event-monitor
!
load-interval default 1
!
service routing protocols model multi-agent
!
hostname B-SPINE3
ip domain lookup vrf MGMT source-interface Management0
ip name-server vrf MGMT 8.8.8.8
dns domain aclabs.lab
!
spanning-tree mode none
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
clock timezone America/Detroit
!
vrf instance MGMT
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
aaa authorization exec default local
!
interface Ethernet1
   description P2P_B-LEAF1_Ethernet3
   no shutdown
   mtu 9114
   no switchport
   ip address unnumbered Loopback0
   pim ipv4 sparse-mode
   isis enable 100
   isis circuit-type level-2
   isis network point-to-point
   pim ipv4 local-interface Loopback0

!
interface Ethernet2
   description P2P_B-LEAF2_Ethernet3
   no shutdown
   mtu 9114
   no switchport
   ip address unnumbered Loopback0
   pim ipv4 sparse-mode
   isis enable 100
   isis circuit-type level-2
   isis network point-to-point
   pim ipv4 local-interface Loopback0

!
interface Ethernet3
   description P2P_B-LEAF3_Ethernet3
   no shutdown
   mtu 9114
   no switchport
   ip address unnumbered Loopback0
   pim ipv4 sparse-mode
   isis enable 100
   isis circuit-type level-2
   isis network point-to-point
   pim ipv4 local-interface Loopback0

!
interface Ethernet4
   description P2P_B-LEAF4_Ethernet3
   no shutdown
   mtu 9114
   no switchport
   ip address unnumbered Loopback0
   pim ipv4 sparse-mode
   isis enable 100
   isis circuit-type level-2
   isis network point-to-point
   pim ipv4 local-interface Loopback0

!
interface Ethernet5
   description P2P_B-LEAF5_Ethernet3
   no shutdown
   mtu 9114
   no switchport
   ip address unnumbered Loopback0
   pim ipv4 sparse-mode
   isis enable 100
   isis circuit-type level-2
   isis network point-to-point
   pim ipv4 local-interface Loopback0

!
interface Ethernet6
   description P2P_B-LEAF6_Ethernet3
   no shutdown
   mtu 9114
   no switchport
   ip address unnumbered Loopback0
   pim ipv4 sparse-mode
   isis enable 100
   isis circuit-type level-2
   isis network point-to-point
   pim ipv4 local-interface Loopback0

!
interface Ethernet7
   description P2P_B-LEAF7_Ethernet3
   no shutdown
