   pim ipv4 sparse-mode
   isis enable 100
   isis circuit-type level-2
   isis network point-to-point
   pim ipv4 local-interface Loopback0

!
interface Ethernet8
   description P2P_B-LEAF8_Ethernet3
   no shutdown
   mtu 9114
   no switchport
   ip address unnumbered Loopback0
   pim ipv4 sparse-mode
   isis enable 100
   isis circuit-type level-2
   isis network point-to-point
   pim ipv4 local-interface Loopback0

!
interface Loopback0
   description Globally Unique Address
   no shutdown
   ip address 10.0.2.203/32
   isis enable 100
   isis passive
   isis circuit-type level-2
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.100.102.103/22
!
mac address-table aging-time 1800
!
ip routing
no ip routing vrf MGMT
!
ip route vrf MGMT 0.0.0.0/0 172.100.100.1
!
arp aging timeout default 1500
!
ip http client local-interface Management0 vrf MGMT
ip ssh client source-interface Management0 vrf MGMT
!
ntp local-interface vrf MGMT Management0
ntp server vrf MGMT time.apple.com iburst
ntp server vrf MGMT time.google.com prefer iburst
ntp server vrf MGMT time.windows.com iburst
!
router bfd
   multihop interval 1000 min-rx 1000 multiplier 3
!
router bgp 65200
   router-id 10.0.2.203
   update wait-install
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   bgp cluster-id 10.0.2.205
   neighbor default send-community
   neighbor LOCAL-EVPN-PEERS peer group
   neighbor LOCAL-EVPN-PEERS remote-as 65200
   neighbor LOCAL-EVPN-PEERS update-source Loopback0
   neighbor LOCAL-EVPN-PEERS bfd
   neighbor LOCAL-EVPN-PEERS route-reflector-client
   neighbor 10.0.2.1 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.2.1 description B-LEAF1.EVPN
   neighbor 10.0.2.2 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.2.2 description B-LEAF2.EVPN
   neighbor 10.0.2.3 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.2.3 description B-LEAF3.EVPN
   neighbor 10.0.2.4 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.2.4 description B-LEAF4.EVPN
   neighbor 10.0.2.5 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.2.5 description B-LEAF5.EVPN
   neighbor 10.0.2.6 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.2.6 description B-LEAF6.EVPN
   neighbor 10.0.2.7 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.2.7 description B-LEAF7.EVPN
   neighbor 10.0.2.8 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.2.8 description B-LEAF8.EVPN
   !
   address-family evpn
      neighbor LOCAL-EVPN-PEERS activate
!
router isis 100
   net 49.1111.0000.0000.0203.00
   router-id ipv4 10.0.2.203
   is-type level-2
   log-adjacency-changes
   !
   address-family ipv4 unicast
   !
!
router multicast
   ipv4
      routing
!
no service interface inactive port-id allocation disabled

!
end
