no aaa root
aaa authentication policy local allow-nopassword-remote-login
!
username admin privilege 15 role network-admin nopassword
!
dhcp relay
   tunnel requests disabled
   mlag peer-link requests disabled
!
ip dhcp relay information option
!
switchport default mode routed
!
vlan internal order ascending range 1006 1199
!
event-monitor
!
load-interval default 1
!
service routing protocols model multi-agent
!
hostname A-LEAF2
ip domain lookup vrf MGMT source-interface Management0
ip name-server vrf MGMT 8.8.8.8
dns domain aclabs.lab
!
spanning-tree mode mstp
no spanning-tree vlan-id 3001,4093-4094
spanning-tree edge-port bpduguard default
spanning-tree mst 0 priority 0
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
clock timezone America/Detroit
!
vlan 10
   name Blue
!
vlan 30
   name Orange
!
vlan 3001
   name MLAG_PEER_VRF_PROD
   trunk group MLAG_PEER
!
vlan 4093
   name MLAG_PEER_L3_UNDERLAY
   trunk group MLAG_PEER
!
vlan 4094
   name MLAG_PEER_SYNC
   trunk group MLAG_PEER
!
vrf instance MGMT
!
vrf instance PROD
!
management api http-commands
   protocol https
   no shutdown
   !
   vrf MGMT
      no shutdown
!
aaa authorization exec default local
!
interface Port-Channel7
   description SERVER_HostA1
   no shutdown
   switchport access vlan 10
   switchport
   mlag 7
   spanning-tree portfast edge
!
interface Port-Channel8
   description SERVER_HostA2
   no shutdown
   switchport access vlan 30
   switchport
   mlag 8
   spanning-tree portfast edge
!
interface Port-Channel1000
   description MLAG_A-LEAF1_Port-Channel1000
   no shutdown
   switchport mode trunk
   switchport trunk group MLAG_PEER
   switchport
!
interface Ethernet1
   description P2P_A-SPINE1_Ethernet2
   no shutdown
   mtu 9114
   no switchport
   ip address 192.168.0.3/31
   pim ipv4 sparse-mode
!
interface Ethernet2
   description P2P_A-SPINE2_Ethernet2
   no shutdown
   mtu 9114
   no switchport
   ip address 192.168.0.19/31
   pim ipv4 sparse-mode
!
interface Ethernet3
   description P2P_A-SPINE3_Ethernet2
   no shutdown
   mtu 9114
   no switchport
   ip address 192.168.0.35/31
   pim ipv4 sparse-mode
!
interface Ethernet4
   description P2P_A-SPINE4_Ethernet2
   no shutdown
   mtu 9114
   no switchport
   ip address 192.168.0.51/31
   pim ipv4 sparse-mode
!
interface Ethernet5
   description MLAG_A-LEAF1_Ethernet5
   no shutdown
   no switchport
   channel-group 1000 mode active
!
interface Ethernet6
   description MLAG_A-LEAF1_Ethernet6
   no shutdown
   no switchport
   channel-group 1000 mode active
!
interface Ethernet7
   description SERVER_HostA1_eth2
   no shutdown
   no switchport
   channel-group 7 mode active
!
interface Ethernet8
   description SERVER_HostA2_eth2
   no shutdown
   no switchport
   channel-group 8 mode active
!
interface Loopback0
   description Globally Unique Address
   no shutdown
   ip address 10.0.1.2/32
!
interface Loopback1
   description Unique VTEP IP
   no shutdown
   ip address 10.1.1.2/32
!
interface Loopback2
   description MLAG Shared VTEP IP
   ip address 10.2.1.1/32
!
interface Loopback101
   description OISM PIM/IGMP Source
   no shutdown
   vrf PROD
   ip address 10.101.101.2/32
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.100.101.106/22
!
interface Vlan10
   description Blue
   no shutdown
   mtu 9014
   vrf PROD
   ip igmp
   pim ipv4 sparse-mode
   pim ipv4 local-interface Loopback101
   ip address virtual 10.10.10.1/24
   ipv6 address virtual 2001:db8:10:10::1/64
   mld
!
interface Vlan30
   description Orange
   no shutdown
   mtu 9014
   vrf PROD
   ip igmp
   pim ipv4 sparse-mode
   pim ipv4 local-interface Loopback101
   ip address virtual 10.30.30.1/24
   ipv6 address virtual 2001:db8:30:30::1/64
   mld
!
interface Vlan3001
   description MLAG_L3_VRF_PROD
   no shutdown
   mtu 9014
   no autostate
   vrf PROD
   ip address 192.0.0.1/31
!
interface Vlan4093
   description MLAG_L3
   no shutdown
   mtu 9114
   no autostate
   ip address 192.0.0.1/31
!
interface Vlan4094
   description MLAG
   no shutdown
   mtu 9114
   no autostate
   ip address 169.254.0.2/30
!
interface Vxlan1
   description A-LEAF2_VTEP
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan udp-port 4789
   vxlan vrf PROD vni 50001
   vxlan mlag source-interface Loopback2
   vxlan vrf PROD multicast group 232.1.1.1
   vxlan vlan 10,30 vni 10010,10030
   vxlan multicast ipv6

!
mac address-table aging-time 1800
!
ip virtual-router mac-address 00:1c:73:00:00:01
!
ip routing
no ip routing vrf MGMT
ip routing vrf PROD
!
ip extcommunity-list regexp evpn-imported permit RT.*
!
ip prefix-list PL-LOOPBACKS
   seq 10 permit 10.0.0.0/16 eq 32
   seq 20 permit 10.1.0.0/16 eq 32
   seq 30 permit 10.2.0.0/16 eq 32
!
ip prefix-list PL-MLAG-PEER-VRFS
   seq 10 permit 192.0.0.0/31
!
ip prefix-list PL-P2P-UNDERLAY
   seq 10 permit 192.168.0.0/24 le 31
ipv6 unicast-routing vrf PROD
!
mlag configuration
   domain-id 100
   local-interface Vlan4094
   peer-address 169.254.0.1
   peer-link Port-Channel1000
!
ip route vrf MGMT 0.0.0.0/0 172.100.100.1
!
arp aging timeout default 1500
!
ip http client local-interface Management0 vrf MGMT
ip ssh client source-interface Management0 vrf MGMT
!
ntp local-interface vrf MGMT Management0
ntp server vrf MGMT time.apple.com iburst
ntp server vrf MGMT time.google.com prefer iburst
ntp server vrf MGMT time.windows.com iburst
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS
!
route-map RM-CONN-2-BGP permit 20
   match ip address prefix-list PL-P2P-UNDERLAY
!
route-map RM-CONN-2-BGP-VRFS deny 10
   match ip address prefix-list PL-MLAG-PEER-VRFS
!
route-map RM-CONN-2-BGP-VRFS permit 20
!
route-map RM-MLAG-PEER-OUT deny 10
   description Deny routes learned from MLAG peer that already carry an EVPN-imported route-target
   match extcommunity evpn-imported
!
route-map RM-MLAG-PEER-OUT permit 20
   description Mark MLAG-peer-originated routes as origin incomplete so remote VTEPs prefer paths via a direct spine
   set origin incomplete
!
router bgp 65101
   router-id 10.0.1.2
   update wait-install
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   maximum-paths 128
   neighbor default send-community
   neighbor LOCAL-EVPN-PEERS peer group
   neighbor LOCAL-EVPN-PEERS remote-as 65100
   neighbor LOCAL-EVPN-PEERS update-source Loopback0
   neighbor LOCAL-EVPN-PEERS bfd
   neighbor LOCAL-EVPN-PEERS ebgp-multihop 3
   neighbor LOCAL-EVPN-PEERS peer-tag in SPINES
   neighbor LOCAL-EVPN-PEERS peer-tag out discard SPINES
   neighbor LOCAL-IPV4-PEERS peer group
   neighbor LOCAL-IPV4-PEERS remote-as 65100
   neighbor LOCAL-IPV4-PEERS peer-tag in SPINES
   neighbor LOCAL-IPV4-PEERS peer-tag out discard SPINES
   neighbor MLAG-IPV4-PEER peer group
   neighbor MLAG-IPV4-PEER remote-as 65101
   neighbor MLAG-IPV4-PEER next-hop-self
   neighbor MLAG-IPV4-PEER route-map RM-MLAG-PEER-OUT out
   neighbor 10.0.1.201 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.1.201 description A-SPINE1.EVPN
   neighbor 10.0.1.202 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.1.202 description A-SPINE2.EVPN
   neighbor 10.0.1.203 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.1.203 description A-SPINE3.EVPN
   neighbor 10.0.1.204 peer group LOCAL-EVPN-PEERS
   neighbor 10.0.1.204 description A-SPINE4.EVPN
   neighbor 192.0.0.0 peer group MLAG-IPV4-PEER
   neighbor 192.0.0.0 description A-LEAF1.IPV4
   neighbor 192.168.0.2 peer group LOCAL-IPV4-PEERS
   neighbor 192.168.0.2 description A-SPINE1_Ethernet2
   neighbor 192.168.0.18 peer group LOCAL-IPV4-PEERS
   neighbor 192.168.0.18 description A-SPINE2_Ethernet2
   neighbor 192.168.0.34 peer group LOCAL-IPV4-PEERS
   neighbor 192.168.0.34 description A-SPINE3_Ethernet2
   neighbor 192.168.0.50 peer group LOCAL-IPV4-PEERS
   neighbor 192.168.0.50 description A-SPINE4_Ethernet2
   redistribute connected route-map RM-CONN-2-BGP
   !
   vlan 10
      rd 10.0.1.2:10010
      route-target both 10010:10010
      redistribute learned
      redistribute router-mac next-hop vtep primary
      redistribute router-mac virtual-ip next-hop vtep primary
   !
   vlan 30
      rd 10.0.1.2:10030
      route-target both 10030:10030
      redistribute learned
      redistribute router-mac next-hop vtep primary
      redistribute router-mac virtual-ip next-hop vtep primary
   !
   address-family evpn
      neighbor LOCAL-EVPN-PEERS activate
      route import match-failure action discard
   !
   address-family ipv4
      neighbor LOCAL-IPV4-PEERS activate
      neighbor MLAG-IPV4-PEER activate
   !
   vrf PROD
      rd 10.0.1.2:50001
      route-target import evpn 50001:50001
      route-target export evpn 50001:50001
      update wait-install
      neighbor 192.0.0.0 peer group MLAG-IPV4-PEER
      neighbor 192.0.0.0 description A-LEAF1.IPV4
      redistribute connected route-map RM-CONN-2-BGP-VRFS
      !
      address-family ipv4
         neighbor 192.0.0.0 activate
      !
      evpn multicast
         address-family ipv4
         !
         address-family ipv6

!
no service interface inactive port-id allocation disabled
mld snooping
   vlan 10,30
router multicast
   ipv4
      routing
   !
   vrf PROD
      ipv4
         routing
      !
      ipv6
         routing

!
end
